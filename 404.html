<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 - HypeYo</title>
<link rel="icon" type="image/png" href="assets/app-icon.png">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{--cyan:#3EE0FF;--blue:#4D7CFE;--violet:#9B7BFF}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans SC","Space Grotesk",-apple-system,"PingFang SC",sans-serif;
  background:#07090F;color:#ECF1FC;text-align:center;padding:24px;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1}
.bg::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;left:50%;top:50%;
  transform:translate(-50%,-50%);filter:blur(110px);
  background:radial-gradient(circle,rgba(77,124,254,.3),transparent 65%)}
.card{max-width:440px}
.code{font-family:"Space Grotesk",sans-serif;font-size:88px;font-weight:700;line-height:1;
  background:linear-gradient(120deg,#8FD8FF,#B4A4FF);-webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:18px}
h1{font-size:22px;font-weight:700;margin-bottom:10px}
p{font-size:14.5px;color:#9AA6C4;line-height:1.8;margin-bottom:28px}
a.btn{display:inline-flex;padding:12px 26px;border-radius:12px;font-size:14.5px;color:#fff;
  background:linear-gradient(135deg,#35B7FF,#4D7CFE 55%,#7C6BFF);
  box-shadow:0 6px 24px -6px rgba(77,124,254,.6);text-decoration:none}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="code">404</div>
  <h1>页面走丢了</h1>
  <p>你访问的页面不存在或已移动。HypeYo 是一款 AI 互动娱乐 App，回到首页继续了解。</p>
  <a class="btn" href="./">返回 HypeYo 首页</a>
</div>
</body>
</html>
